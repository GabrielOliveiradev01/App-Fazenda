# Site estático — sem build de framework
[build]
  command = "true"
  publish = "."

# Evita pós-processamento que falha com imagens grandes/acentos
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false
